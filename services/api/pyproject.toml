[project]
name = "atlas-api"
version = "0.1.0"
description = "ATLAS platform API - multi-tenant CRM and voice agent orchestration"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.32,<0.36",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "email-validator>=2.2,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<2",
    "httpx>=0.28,<0.29",
    "redis>=5.2,<7",
    "arq>=0.26,<0.27",
    "argon2-cffi>=23.1,<26",
    "pyjwt>=2.10,<3",
    "cryptography>=44,<47",
    "phonenumbers>=8.13,<10",
    "python-multipart>=0.0.18,<0.1",
    "prometheus-client>=0.21,<0.23",
    "tzdata>=2025.2",
    "av==19.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1.2",
    "pytest-cov>=6,<7",
    "ruff>=0.8,<0.13",
    "mypy>=1.13,<2",
    "respx>=0.22,<0.23",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM"]
ignore = ["B008", "S101", "RUF012", "UP038", "UP046"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["arq.*", "phonenumbers.*", "respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
