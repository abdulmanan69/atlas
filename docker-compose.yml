# ATLAS local development stack.
#
#   make infra      -> postgres + redis only (run api/web on the host for fast reloads)
#   make up         -> full stack in containers (profile "app")
#
# Ports bind to 127.0.0.1 only. Named volumes live inside Docker's data disk.

name: atlas

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${ATLAS_POSTGRES_PASSWORD:-atlas}
      POSTGRES_DB: atlas
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/docker/postgres-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 3s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 768m
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 320m
    restart: unless-stopped

  api:
    profiles: ["app"]
    build:
      context: ./services/api
    env_file: .env
    environment:
      ATLAS_DATABASE_URL: postgresql+asyncpg://atlas:${ATLAS_POSTGRES_PASSWORD:-atlas}@postgres:5432/atlas
      ATLAS_REDIS_URL: redis://redis:6379/0
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8080 --proxy-headers --forwarded-allow-ips='*'"]
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v1/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    profiles: ["app"]
    build:
      context: ./services/api
    env_file: .env
    environment:
      ATLAS_DATABASE_URL: postgresql+asyncpg://atlas:${ATLAS_POSTGRES_PASSWORD:-atlas}@postgres:5432/atlas
      ATLAS_REDIS_URL: redis://redis:6379/0
    command: ["arq", "app.workers.main.WorkerSettings"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  # ---------------------------------------------------------------- voice runtime
  # Internal real-time voice engine (see THIRD_PARTY_NOTICES.md). Headless: its own
  # UI is not deployed; ATLAS drives it over HTTP. Start with: make voice-up
  voice-db:
    profiles: ["voice"]
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: voice
      POSTGRES_PASSWORD: ${ATLAS_VOICE_DB_PASSWORD:-voice}
      POSTGRES_DB: voice
    volumes:
      - voice_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice -d voice"]
      interval: 3s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped

  voice-redis:
    profiles: ["voice"]
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - voice_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 160m
    restart: unless-stopped

  voice-storage:
    profiles: ["voice"]
    image: dograhai/minio:2026.09.22
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${ATLAS_VOICE_STORAGE_USER:-voiceadmin}
      MINIO_ROOT_PASSWORD: ${ATLAS_VOICE_STORAGE_PASSWORD:-voiceadmin-change-me}
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:5173"
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - voice_storage_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384m
    restart: unless-stopped

  voice-runtime:
    profiles: ["voice"]
    # Lets the voice service call ATLAS on the host (webhooks, test-call results). Docker
    # Desktop (Windows/macOS) provides this name already; Linux needs the mapping.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Pinned to the version whose source is in vendor/voice-runtime (contract-checked).
    image: dograhai/dograh-api:1.49.0
    environment:
      ENVIRONMENT: local
      LOG_LEVEL: INFO
      ENABLE_SIGNUP: "true"
      DATABASE_URL: postgresql+asyncpg://voice:${ATLAS_VOICE_DB_PASSWORD:-voice}@voice-db:5432/voice
      # Dedicated Redis: the runtime's job queue uses fixed key names, so sharing an
      # instance (even on another logical DB) lets its workers consume ATLAS jobs.
      REDIS_URL: redis://voice-redis:6379/0
      ENABLE_AWS_S3: "false"
      MINIO_ENDPOINT: voice-storage:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: ${ATLAS_VOICE_STORAGE_USER:-voiceadmin}
      MINIO_SECRET_KEY: ${ATLAS_VOICE_STORAGE_PASSWORD:-voiceadmin-change-me}
      MINIO_BUCKET: voice-audio
      MINIO_SECURE: "false"
      BACKEND_API_ENDPOINT: http://localhost:8000
      FASTAPI_WORKERS: "1"
      # ATLAS owns campaigns; the Asterisk bridge is only needed for SIP via ARI.
      ENABLE_ARI_MANAGER: "false"
      ENABLE_CAMPAIGN_ORCHESTRATOR: "false"
      # Process-wide latency histograms for ATLAS's pipeline health panel (ADR 0006).
      # /metrics answers 503 until ATLAS_VOICE_RUNTIME_METRICS_SECRET is set.
      ENABLE_PROMETHEUS_METRICS: "true"
      DOGRAH_DEVOPS_SECRET: ${ATLAS_VOICE_RUNTIME_METRICS_SECRET:-}
      FORWARDED_ALLOW_IPS: "*"
      OSS_JWT_SECRET: ${ATLAS_VOICE_RUNTIME_JWT_SECRET:?set ATLAS_VOICE_RUNTIME_JWT_SECRET in .env}
      # Enterprise default: no third-party product analytics leave the deployment.
      ENABLE_TELEMETRY: "false"
      POSTHOG_API_KEY: ""
      POSTHOG_HOST: ""
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      voice-db: { condition: service_healthy }
      voice-storage: { condition: service_healthy }
      voice-redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health').read()\""]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 2g
    restart: unless-stopped

  # ------------------------------------------------------------- local AI models
  # Optional self-hosted models (CPU). Start with: make local-ai-up (+ make local-tts-up,
  # make local-stt-up). In ATLAS add a "Self-hosted models" connection with base URL
  #   http://local-llm:11434/v1     (language model)
  #   http://local-speech:8000/v1   (speech-to-text and Kokoro voice)
  #   http://local-tts:8000/v1      (Pocket TTS voice, optional)
  # and, for live English transcription, a Deepgram connection with base URL
  #   http://local-stt:8000         (streaming speech-to-text, optional)
  # Every setting below is tuned for reply latency on CPU; see docs/local-models.md.
  local-llm:
    profiles: ["local-ai"]
    image: ollama/ollama:0.40.6
    environment:
      # Keep the model in memory: a cold load adds seconds to the first reply.
      # Negative = never unload. Set LOCAL_LLM_KEEP_ALIVE=30m to free RAM when idle.
      OLLAMA_KEEP_ALIVE: "${LOCAL_LLM_KEEP_ALIVE:--1}"
      # One request at a time gets all CPU cores; parallel slots split them.
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      # Phone prompts are short; a fixed 4k window bounds RAM (scales with NUM_PARALLEL).
      OLLAMA_CONTEXT_LENGTH: "4096"
      # CPU backend supports it (default is "auto"); forced on. Measured 2026-10-19 on the
      # 6-core dev CPU, fresh 740-token prompt: first token 7.8-8.1 s on vs 8.6 s off.
      # num_batch 512 and q4_K_M were also measured best (docs/perf/local-llm-tuning.json);
      # for threads see LLAMA_ARG_THREADS below.
      OLLAMA_FLASH_ATTENTION: "1"
      # Local only: no remote inference or web search.
      OLLAMA_NO_CLOUD: "1"
      # The model server keeps earlier prompts in RAM so a later request can reuse them,
      # even after another request ran in between (ATLAS's warm-up relies on this). Its
      # default cap, 8192 MiB, is far above this container's limit: measured 27 MiB per
      # 965-token call prompt, so 256 MiB keeps about 9 of them.
      LLAMA_ARG_CACHE_RAM: "256"
      # CPU threads of the model server (read by llama.cpp; Ollama passes no -t unless a
      # model sets num_thread). The voice speaks while the model is still writing the
      # reply, so leave it 2 cores: measured on the 6-core dev CPU with all three servers
      # busy, 4 threads started replies 0.5 s sooner than 6 (all cores) and kept the
      # voice smooth, while 5 or 6 left audible pauses mid-reply and 5 also stutter
      # (docs/perf/local-turn-contention.json).
      # Set LOCAL_LLM_THREADS to your physical core count minus 2; -1 = all cores.
      LLAMA_ARG_THREADS: "${LOCAL_LLM_THREADS:-4}"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - local_llm_models:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 2560m
    restart: unless-stopped

  local-speech:
    profiles: ["local-ai"]
    image: ghcr.io/speaches-ai/speaches:0.8.3-cpu
    environment:
      # int8 weights: faster on CPU, small accuracy cost.
      WHISPER__COMPUTE_TYPE: int8
      # Threads for Whisper; STT and the LLM run one after the other in a turn.
      WHISPER__CPU_THREADS: "${LOCAL_STT_THREADS:-4}"
      # Never unload models (-1). In this version the Whisper TTL also applies to Kokoro.
      WHISPER__TTL: "-1"
      # No Gradio UI: less memory, faster start.
      ENABLE_UI: "false"
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - local_speech_models:/home/ubuntu/.cache/huggingface/hub
    deploy:
      resources:
        limits:
          memory: 1792m
    restart: unless-stopped

  # Kyutai Pocket TTS behind an OpenAI-compatible /v1/audio/speech (built locally from
  # infra/docker/pocket-tts). Weights download on first start (about 0.3 GB) into the volume.
  local-tts:
    profiles: ["local-ai"]
    build:
      context: infra/docker/pocket-tts
    image: atlas/local-tts:pocket-tts-3.3.0
    environment:
      POCKET_TTS_LANGUAGE: english
      POCKET_TTS_DEFAULT_VOICE: alba
      # torch threads for synthesis (the audio decoder runs on one more thread). 1, the
      # library's own choice, measured best while the language model runs: with 2 the
      # voice stuttered 26 times in 10 turns, with 1 never (docs/perf/local-turn-contention.json).
      POCKET_TTS_THREADS: "${LOCAL_TTS_THREADS:-1}"
      # Optional voice cloning: a Hugging Face token of an account that accepted the terms
      # of the gated kyutai/pocket-tts weights (docs/local-models.md, "Voice cloning").
      # Empty = no cloning; built-in voices work either way. Cloned voices are kept in the
      # volume below (voices/).
      HF_TOKEN: "${POCKET_TTS_HF_TOKEN:-}"
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      - local_tts_models:/home/app/.cache
    deploy:
      resources:
        limits:
          memory: 1536m
    restart: unless-stopped

  # Live (streaming) English speech-to-text that answers the Deepgram live-listen protocol,
  # built locally from infra/docker/streaming-stt (sherpa-onnx streaming Zipformer, CPU).
  # In ATLAS add a Deepgram connection with base URL http://local-stt:8000.
  # The model (about 75 MB) downloads on first start into the volume.
  local-stt:
    profiles: ["local-ai"]
    build:
      context: infra/docker/streaming-stt
    image: atlas/local-stt:sherpa-onnx-1.13.8
    environment:
      STT_MODEL_ID: zipformer-en-streaming
      # Threads per decode. Recognition runs while the caller talks, the LLM after.
      STT_NUM_THREADS: "2"
      STT_MAX_SESSIONS: "4"
      # Silence after words that ends a segment when the voice service does not send
      # Finalize first (it does, 0.2 s after the caller stops).
      STT_ENDPOINT_SILENCE_MS: "400"
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:8003:8000"
    volumes:
      - local_stt_models:/models
    deploy:
      resources:
        limits:
          # Measured peak 217 MiB with 4 calls at once; flat over an 8-minute call.
          memory: 384m
    restart: unless-stopped

volumes:
  local_llm_models:
  local_speech_models:
  local_stt_models:
  local_tts_models:
  pg_data:
  redis_data:
  voice_db_data:
  voice_redis_data:
  voice_storage_data:
